# Alembic 설정 (backend/ 에서 실행).
# DB URL 은 여기 두지 않고 db/migrations/env.py 가 src.api.config.settings 에서 읽는다.
[alembic]
script_location = db/migrations
prepend_sys_path = .
path_separator = os
# 리비전 파일명: 날짜 prefix 로 정렬.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
