/* ---- Toast Notification ---- */
function toast(msg, type = 'success') {
  const colors = { success: ['#10b981', 'check-circle'], info: ['#4f46e5', 'info'], error: ['#ef4444', 'alert-circle'] };
  const [col, ic] = colors[type] || colors.success;
  const el = document.createElement('div');
  el.className = 'toast-in flex items-center gap-3 bg-white/95 backdrop-blur-md shadow-float rounded-xl pl-3 pr-4 py-3 border border-slate-200/80 min-w-[280px] transition-all duration-300';
  el.style.transform = 'translateY(12px)';
  el.style.opacity = '0';
  el.innerHTML = `
    <span class="grid place-items-center w-8 h-8 rounded-lg" style="background:${col}1a;color:${col}">
      ${icon(ic, 'w-4.5 h-4.5')}
    </span>
    <span class="text-sm font-semibold text-slate-800">${msg}</span>
  `;
  $('#toast-root').appendChild(el);
  refreshIcons();
  
  // Animate in
  setTimeout(() => {
    el.style.transform = 'none';
    el.style.opacity = '1';
  }, 10);
  
  // Remove
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

/* Pipeline sequence */
function startReportGeneration() {
  if (PIPELINE.running) return;
  const area = $('#query-textarea');
  const query = (area && area.value.trim()) || '이 종목의 실적 및 밸류에이션 리서치를 진행해줘.';
  
  PIPELINE.completed = false;
  PIPELINE.queryText = query;
  PIPELINE.generatedReports = [];
  
  // Auto-detect stock from query
  let detectedTicker = '005930';
  const lowerQuery = query.toLowerCase();
  if (lowerQuery.includes('하이닉스') || lowerQuery.includes('hynix') || lowerQuery.includes('000660')) {
    detectedTicker = '000660';
  } else if (lowerQuery.includes('현대') || lowerQuery.includes('hyundai') || lowerQuery.includes('005380')) {
    detectedTicker = '005380';
  } else if (lowerQuery.includes('lg') || lowerQuery.includes('엘지') || lowerQuery.includes('엔솔') || lowerQuery.includes('energy') || lowerQuery.includes('373220')) {
    detectedTicker = '373220';
  }
  PIPELINE.ticker = detectedTicker;
  
  if (area) {
    area.value = '';
    area.style.height = 'auto';
  }
  
  // Transition views
  $('#intro-screen').classList.add('hidden');
  $('#conversation-panel').classList.remove('hidden');
  $('#user-query-text').textContent = query;
  $('#pipeline-box').classList.remove('hidden');
  $('#ai-final-message').classList.add('hidden');
  
  PIPELINE.running = true;
  $('#query-submit-btn').disabled = true;
  
  let currentStep = 0;
  const totalSteps = PIPELINE.steps.length;
  
  const processNextStep = () => {
    if (currentStep > 0) {
      // Mark previous complete
      const prevIdx = currentStep - 1;
      const prevStepEl = $(`#step-${prevIdx}`);
      if (prevStepEl) {
        prevStepEl.classList.remove('bg-indigo-50/50');
        prevStepEl.classList.add('opacity-100');
        $(`#step-ico-${prevIdx}`).className = 'w-7 h-7 rounded-lg bg-emerald-100 text-emerald-600 grid place-items-center mt-0.5';
        $(`#step-ico-${prevIdx}`).innerHTML = icon('check', 'w-4 h-4');
        $(`#step-status-${prevIdx}`).className = 'text-[11px] font-bold text-emerald-600 mt-0.5';
        $(`#step-status-${prevIdx}`).textContent = '검증 완료';
      }
    }
    
    if (currentStep >= totalSteps) {
      // All done!
      finalizeReport(query);
      return;
    }
    
    // Highlight current
    const curEl = $(`#step-${currentStep}`);
    if (curEl) {
      curEl.classList.remove('opacity-40');
      curEl.classList.add('bg-indigo-50/50', 'opacity-100');
      $(`#step-ico-${currentStep}`).className = 'w-7 h-7 rounded-lg bg-indigo-600 text-white grid place-items-center mt-0.5';
      $(`#step-status-${currentStep}`).innerHTML = `<span class="typing text-indigo-600 text-base leading-none">·<span>·</span><span>·</span></span>`;
    }
    
    // Update progress bar
    const pctVal = Math.round(((currentStep + 1) / totalSteps) * 100);
    $('#pipe-progress-bar').style.width = pctVal + '%';
    $('#pipe-pct').textContent = pctVal + '%';
    
    refreshIcons();
    currentStep++;
    
    // Variable latency per agent step
    const delay = currentStep === 1 ? 800 : (700 + Math.random() * 600);
    PIPELINE.timer = setTimeout(processNextStep, delay);
  };
  
  // Start sequence
  processNextStep();
}

function finalizeReport(query) {
  PIPELINE.running = false;
  $('#query-submit-btn').disabled = false;
  
  const stock = DATA.byTicker[PIPELINE.ticker];
  const templates = STOCK_REPORT_TEMPLATES[stock.t] || STOCK_REPORT_TEMPLATES['005930'];
  
  // Decide which types of the 5 reports are generated (at least 2, randomly up to 5)
  const activeTypes = [];
  for (let t = 1; t <= 5; t++) {
    if (Math.random() > 0.4 || activeTypes.length < 2) {
      activeTypes.push(t);
    }
  }
  activeTypes.sort((a, b) => a - b);
  
  const generatedReports = [];
  
  // Create and store each generated report separately
  activeTypes.forEach(t => {
    const template = templates[t - 1];
    const newReportId = `r_${t}_${Date.now()}`;
    const evidCount = template.evid + Math.floor(Math.random() * 5) - 2;
    const confScore = template.conf + Math.floor(Math.random() * 3) - 1;
    
    const newReport = {
      id: newReportId,
      stock: stock.n,
      t: stock.t,
      title: `${stock.n} ${template.title}`,
      conf: confScore,
      date: new Date().toISOString().split('T')[0],
      tag: template.tag,
      evid: evidCount,
      sec: stock.sec
    };
    
    // Add to DATA.reports
    DATA.reports.unshift(newReport);
    
    // Generate distinct content and charts
    generateReportContent(newReportId, stock, t, newReport.title, newReport.tag, newReport.evid, newReport.conf);
    
    // Save info for rendering buttons
    generatedReports.push({ typeIndex: t, reportId: newReportId, title: newReport.title });
  });
  
  // Show final success message in query page
  PIPELINE.completed = true;
  PIPELINE.generatedReports = generatedReports;
  $('#pipeline-box').classList.add('hidden');
  $('#ai-final-message').classList.remove('hidden');
  
  $('#ai-success-text').textContent = `질문하신 "${stock.n}" 분석 결과, 총 ${generatedReports.length}개의 리포트가 성공적으로 생성되었습니다. 각 리포트의 신뢰 노드는 검증 게이트를 완벽히 통과했습니다.`;

  const buttonsContainer = $('#generated-report-buttons-container');
  if (buttonsContainer) {
    let buttonsHtml = '<span class="text-[10.5px] font-extrabold text-slate-500 mr-1">리포트 열기:</span>';
    const typeLabels = {
      1: '재무/펀더멘탈',
      2: '가격/기술',
      3: '뉴스/심리',
      4: '수급',
      5: '산업/거시'
    };
    for (let t = 1; t <= 5; t++) {
      const genRep = generatedReports.find(gr => gr.typeIndex === t);
      const label = typeLabels[t];
      if (genRep) {
        buttonsHtml += `
          <button onclick="navigate('reports', { reportId: '${genRep.reportId}', from: 'research' })" 
                  title="${genRep.title} (검증 완료)" 
                  class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-[11px] shadow-sm transition hover:scale-105 active:scale-95 flex items-center justify-center shrink-0">
            ${label}
          </button>
        `;
      } else {
        const title = templates[t - 1].title;
        buttonsHtml += `
          <button disabled 
                  title="${stock.n} ${title} (미생성)" 
                  class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-300 border border-slate-200 text-[11px] font-extrabold flex items-center justify-center cursor-not-allowed shrink-0">
            ${label}
          </button>
        `;
      }
    }
    buttonsContainer.innerHTML = buttonsHtml;
  }
  
  const scrollArea = $('#chat-scroll-area');
  scrollArea.scrollTop = scrollArea.scrollHeight;
  
  toast(`총 ${generatedReports.length}개의 리포트가 생성되었습니다!`);
}

function renderReports(params = {}) {
  const reportId = params.reportId || (DATA.reports[0] && DATA.reports[0].id) || 'r1';
  renderReportDetail(reportId);
}

function filterType(type) {
  selectedType = type;
  renderLibrary();
}

function searchReports(val) {
  searchKeyword = val.trim();
  renderLibrary();
}

function openReport(id) {
  navigate('reports', { reportId: id, from: 'library' });

/* ============================================================ INTERACTIVE SVG KNOWLEDGE GRAPH */
function renderSVGGraph(graphData) {
  const container = document.getElementById('evidence-graph-container');
  if (!container) return;

  let html = `<svg viewBox="0 0 460 200" class="w-full h-full">`;

  // Draw Edges (Links)
  graphData.edges.forEach(e => {
    const fromNode = graphData.nodes.find(n => n.id === e.from);
    const toNode = graphData.nodes.find(n => n.id === e.to);
    if (fromNode && toNode) {
      html += `<line x1="${fromNode.x}" y1="${fromNode.y}" x2="${toNode.x}" y2="${toNode.y}" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3" class="edge" id="edge-${e.from}-${e.to}"></line>`;
    }
  });

  // Draw Nodes
  graphData.nodes.forEach(n => {
    html += `
    <g class="node-group cursor-pointer" id="node-${n.id}" data-id="${n.id}" onmouseover="highlightNode('${n.id}')" onmouseout="clearHighlight()">
      <circle cx="${n.x}" cy="${n.y}" r="22" fill="${n.color}" opacity="0.1" class="node-glow transition-all duration-200"></circle>
      <circle cx="${n.x}" cy="${n.y}" r="6.5" fill="${n.color}" class="node-dot"></circle>
      <text x="${n.x}" y="${n.y + 34}" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">${n.label}</text>
    </g>
    `;
  });

  html += `</svg>`;
  container.innerHTML = html;
}

function highlightNode(nodeId) {
  const container = $('#evidence-graph-container');
  if (!container) return;

  const reportId = STATE.params.reportId || 'r1';
  const content = REPORT_CONTENTS[reportId] || REPORT_CONTENTS['r1'];
  const graph = content.graph;
  const node = graph.nodes.find(n => n.id === nodeId);
  if (!node) return;

  // Connected node ids
  const connectedIds = new Set([nodeId]);
  
  // Highlighting edges
  graph.edges.forEach(e => {
    const line = $(`#edge-${e.from}-${e.to}`, container);
    if (line) {
      if (e.from === nodeId || e.to === nodeId) {
        connectedIds.add(e.from);
        connectedIds.add(e.to);
        line.setAttribute('stroke', '#4f46e5');
        line.setAttribute('stroke-width', '2.5');
        line.removeAttribute('stroke-dasharray');
      } else {
        line.setAttribute('stroke', '#f1f5f9');
        line.setAttribute('stroke-width', '1');
      }
    }
  });

  // Dim other nodes, enlarge target and neighbors
  graph.nodes.forEach(n => {
    const g = $(`#node-${n.id}`, container);
    if (g) {
      if (connectedIds.has(n.id)) {
        g.style.opacity = '1';
        const glow = g.querySelector('.node-glow');
        glow.setAttribute('r', '26');
        glow.setAttribute('opacity', '0.2');
      } else {
        g.style.opacity = '0.25';
      }
    }
  });

  // Display description card
  const tooltip = $('#graph-tooltip');
  if (tooltip) {
    let desc = '';
    if (node.type === 'source') desc = '공시 문서 및 유력 저널의 검증 완료된 원본 데이터 소스 노드입니다.';
    else if (node.type === 'fact') desc = '데이터 소스로부터 추출 정제된 수치 및 수율 관련 팩트 인자 노드입니다.';
    else desc = '여러 신뢰 팩트 노드들을 GraphRAG 추론하여 도출한 최종 핵심 결론 노드입니다.';
    
    tooltip.innerHTML = `
      <div class="flex items-center justify-between text-xs font-bold border-b border-slate-700/60 pb-1.5 mb-1.5">
        <span class="flex items-center gap-1.5" style="color: ${node.color}">
          <span class="w-2 h-2 rounded-full" style="background: ${node.color}"></span>
          ${node.label}
        </span>
        <span class="text-[10px] text-slate-400 capitalize">${node.type} node</span>
      </div>
      <p class="text-[11px] text-slate-300 leading-normal font-medium">${desc}</p>
    `;
    tooltip.style.opacity = '1';
  }
}

function clearHighlight() {
  const container = $('#evidence-graph-container');
  if (!container) return;

  const reportId = STATE.params.reportId || 'r1';
  const content = REPORT_CONTENTS[reportId] || REPORT_CONTENTS['r1'];
  const graph = content.graph;

  // Reset edges
  graph.edges.forEach(e => {
    const line = $(`#edge-${e.from}-${e.to}`, container);
    if (line) {
      line.setAttribute('stroke', '#cbd5e1');
      line.setAttribute('stroke-width', '1.5');
      line.setAttribute('stroke-dasharray', '3,3');
    }
  });

  // Reset nodes
  graph.nodes.forEach(n => {
    const g = $(`#node-${n.id}`, container);
    if (g) {
      g.style.opacity = '1';
      const glow = g.querySelector('.node-glow');
      glow.setAttribute('r', '22');
      glow.setAttribute('opacity', '0.1');
    }
  });

  // Hide description card
  const tooltip = $('#graph-tooltip');
  if (tooltip) {
    tooltip.style.opacity = '0';
  }
}
