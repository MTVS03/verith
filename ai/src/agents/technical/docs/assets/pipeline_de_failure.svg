<svg viewBox="0 0 1560 2020" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK KR, NanumGothic, sans-serif">
  <rect width="1560" height="2020" fill="#f4f4ef"/>
  <text x="55" y="55" font-size="30" font-weight="700" fill="#2d2d2d">2장 · D·E 층과 실패 분기</text>
  <text x="57" y="90" font-size="17" fill="#8a8a8a">왼쪽 = 성공 줄기 · 오른쪽 = E가 받는 실패 · 초록점선 = D 검증</text>

  <!-- E harness -->
  <rect x="55" y="120" width="1450" height="1820" rx="14" fill="#eceae4" stroke="#b5b0a5" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="90" y="170" font-size="21" font-weight="700" fill="#5a564c">E · 하네스 (kis_client + supervisor) — 전체를 감쌈</text>
  <text x="92" y="200" font-size="15.5" fill="#8a8a8a">흐름 어디서 터져도 여기서 받음</text>

  <!-- success column -->
  <rect x="130" y="270" width="440" height="90" rx="10" fill="#d8ecdd" stroke="#4a9a63" stroke-width="1.8"/>
  <text x="350" y="308" font-size="19" font-weight="700" fill="#3d7a4f" text-anchor="middle">3. 데이터 수집</text>
  <text x="350" y="335" font-size="15.5" fill="#3a6c4c" text-anchor="middle">KIS D/W/M 호출 (일·주·월봉)</text>
  <line x1="350" y1="360" x2="350" y2="400" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a7)"/>

  <rect x="130" y="400" width="440" height="90" rx="10" fill="#d8ecdd" stroke="#4a9a63" stroke-width="1.8"/>
  <text x="350" y="438" font-size="19" font-weight="700" fill="#3d7a4f" text-anchor="middle">5. 국면 분류</text>
  <text x="350" y="465" font-size="15.5" fill="#3a6c4c" text-anchor="middle">regime 라벨 확정 (월봉 우선 보정)</text>
  <line x1="350" y1="490" x2="350" y2="530" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a7)"/>

  <rect x="130" y="530" width="440" height="90" rx="10" fill="#d8ecdd" stroke="#4a9a63" stroke-width="1.8"/>
  <text x="350" y="568" font-size="19" font-weight="700" fill="#3d7a4f" text-anchor="middle">6–8. 종합·신뢰도·리스크</text>
  <text x="350" y="595" font-size="15.5" fill="#3a6c4c" text-anchor="middle">score·confidence 계산</text>
  <line x1="350" y1="620" x2="350" y2="660" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a7)"/>

  <rect x="130" y="660" width="440" height="90" rx="10" fill="#e3ddf2" stroke="#7a6bc0" stroke-width="1.8"/>
  <text x="350" y="698" font-size="19" font-weight="700" fill="#5a4b8a" text-anchor="middle">10. 국면 해석 · 리포트</text>
  <text x="350" y="725" font-size="15.5" fill="#6a5b9a" text-anchor="middle">LLM · 문장 작성</text>
  <line x1="350" y1="750" x2="350" y2="790" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a7)"/>

  <rect x="150" y="790" width="400" height="70" rx="10" fill="#eceae4" stroke="#c9c5bb"/>
  <text x="350" y="832" font-size="19" font-weight="700" fill="#4a4a44" text-anchor="middle">상위 반환</text>

  <!-- E-1 -->
  <rect x="720" y="270" width="620" height="90" rx="10" fill="#f5e4dc" stroke="#d9a08e"/>
  <text x="745" y="308" font-size="19" font-weight="700" fill="#b23a2e">E-1. 재시도 · 백오프</text>
  <text x="745" y="335" font-size="15.5" fill="#9a3a30">그래도 실패 → stale 캐시 폴백 (D/W/M 타임프레임별)</text>
  <line x1="570" y1="308" x2="718" y2="308" stroke="#a5a095" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a7g)"/>
  <text x="640" y="298" font-size="14.5" fill="#8a5a4a" text-anchor="middle">호출 실패</text>

  <!-- E-2 -->
  <rect x="720" y="405" width="620" height="90" rx="10" fill="#f5e4dc" stroke="#d9a08e"/>
  <text x="745" y="443" font-size="19" font-weight="700" fill="#b23a2e">E-2. 데이터부족 가드</text>
  <text x="745" y="470" font-size="15.5" fill="#9a3a30">regime = "판단 불가"로 정직히 빠짐</text>
  <line x1="570" y1="443" x2="718" y2="443" stroke="#a5a095" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a7g)"/>
  <text x="640" y="433" font-size="14.5" fill="#8a5a4a" text-anchor="middle">봉 부족</text>

  <!-- transition -->
  <text x="180" y="920" font-size="16" fill="#7a766c">↓ 위 성공 줄기를 D가 아래에서 검사</text>

  <!-- D observability -->
  <rect x="110" y="960" width="1320" height="640" rx="12" fill="#e6efe0" stroke="#8aab7a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="145" y="1005" font-size="20" font-weight="700" fill="#4a6a3a">D · 관측/평가 (observability)</text>
  <text x="147" y="1035" font-size="15.5" fill="#6a8a5a">전 구간 trace + 검증 3층. 아래 3개가 각 노드를 검사</text>

  <rect x="160" y="1070" width="600" height="140" rx="10" fill="#f4e6c3" stroke="#d9b25a"/>
  <text x="185" y="1108" font-size="18" font-weight="700" fill="#8a6d1f">① 계산 정확성 (기존)</text>
  <text x="185" y="1142" font-size="15.5" fill="#7a5f1a">RSI·이동평균이 라이브러리와 일치?</text>
  <text x="185" y="1174" font-size="15.5" fill="#7a5f1a">→ 노드 4·5 검사 · mock 단위테스트</text>

  <rect x="790" y="1070" width="600" height="140" rx="10" fill="#f4e6c3" stroke="#d9b25a"/>
  <text x="815" y="1108" font-size="18" font-weight="700" fill="#8a6d1f">② regime 규칙 (신규)</text>
  <text x="815" y="1142" font-size="15.5" fill="#7a5f1a">"정배열+RSI72" → 정말 "과열"?</text>
  <text x="815" y="1174" font-size="15.5" fill="#7a5f1a">→ 노드 5 검사 · 입력→라벨 케이스 (MTF 포함)</text>

  <rect x="160" y="1240" width="1230" height="150" rx="10" fill="#f5dad3" stroke="#c0442e" stroke-width="1.8"/>
  <text x="185" y="1280" font-size="18" font-weight="700" fill="#b23a2e">③ LLM 라벨 왜곡 검증 (신규 · 최중요)</text>
  <text x="185" y="1316" font-size="15.5" fill="#9a3a30">코드가 준 라벨 == LLM 출력의 라벨? regime "횡보"인데 "상승 전환 관찰" 쓰면 = 환각</text>
  <text x="185" y="1350" font-size="15.5" fill="#9a3a30">→ 노드 10 검사 · trajectory eval · "LLM을 썼지만 검증으로 가뒀다"를 증명하는 지점</text>

  <!-- legend -->
  <rect x="110" y="1660" width="1320" height="240" rx="12" fill="#eceae4" stroke="#d5d0c6"/>
  <text x="145" y="1700" font-size="19" font-weight="700" fill="#4a4a44">읽는 법</text>
  <g font-size="16" fill="#6a6a60">
    <text x="150" y="1736">· 바깥 회색 점선 = E : 실패를 받는 층 (재시도·폴백·판단불가 가드)</text>
    <text x="150" y="1768">· 초록 점선 = D : 검증 3층. ①② 코드 검증 / ③ LLM 검증(빨강 = 최중요)</text>
    <text x="150" y="1800">· A(흐름 분기)는 화살표로 이미 표현 · C(메모리)는 없는 게 정답</text>
    <text x="150" y="1832">· KIS 실패는 D/W/M 타임프레임별로 분기 · stale = "최신 시세 미반영"</text>
    <text x="150" y="1864">· 3번 라벨 = "상승 전환 관찰"(bullish_reversal_watch) 확정</text>
  </g>

  <defs>
    <marker id="a7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#8a8a8a"/></marker>
    <marker id="a7g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#a5a095"/></marker>
  </defs>
</svg>
