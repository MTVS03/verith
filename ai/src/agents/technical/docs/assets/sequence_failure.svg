<svg viewBox="0 0 1180 1180" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK KR, NanumGothic, sans-serif">
  <rect width="1180" height="1180" fill="#f4f4ef"/>
  <text x="70" y="70" font-size="34" font-weight="700" fill="#2d2d2d">시퀀스 2 · KIS 장애 흐름 (E 복원력)</text>
  <text x="72" y="108" font-size="19" fill="#8a8a8a">D/W/M 타임프레임별 실패 분기 · 리샘플 폴백 없음 · 환각으로 안 채움</text>

  <g stroke="#c9c9c2" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="300" y1="290" x2="300" y2="1130"/>
    <line x1="640" y1="290" x2="640" y2="1130"/>
    <line x1="980" y1="290" x2="980" y2="1130"/>
  </g>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <rect x="205" y="240" width="190" height="48" rx="10" fill="#e3ddf2" stroke="#b7abdb"/><text x="300" y="270" fill="#5a4b8a">기술적 에이전트</text>
    <rect x="575" y="240" width="130" height="48" rx="10" fill="#d8ecdd" stroke="#9ccca8"/><text x="640" y="270" fill="#3d7a4f">캐시</text>
    <rect x="905" y="240" width="150" height="48" rx="10" fill="#d8ecdd" stroke="#9ccca8"/><text x="980" y="270" fill="#3d7a4f">KIS API</text>
  </g>

  <g font-size="17" fill="#3a3a3a" text-anchor="middle">
    <!-- 1 -->
    <line x1="300" y1="340" x2="638" y2="340" stroke="#6a6a6a" stroke-width="2" marker-end="url(#ah2)"/>
    <text x="470" y="330">일·주·월봉 캐시 조회</text>
    <circle cx="300" cy="340" r="12" fill="#4a4a44"/><text x="300" y="345" fill="#fff" font-size="14">1</text>
    <!-- 2 -->
    <line x1="640" y1="382" x2="302" y2="382" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah2)"/>
    <text x="470" y="372">과거분 (정상)</text>
    <circle cx="640" cy="382" r="12" fill="#4a4a44"/><text x="640" y="387" fill="#fff" font-size="14">2</text>
    <!-- 3 -->
    <line x1="300" y1="424" x2="978" y2="424" stroke="#6a6a6a" stroke-width="2" marker-end="url(#ah2)"/>
    <text x="640" y="414">D/W/M 필요분 호출</text>
    <circle cx="300" cy="424" r="12" fill="#4a4a44"/><text x="300" y="429" fill="#fff" font-size="14">3</text>
    <!-- 4 fail -->
    <line x1="980" y1="466" x2="302" y2="466" stroke="#c0442e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahr)"/>
    <text x="640" y="456" fill="#c0442e" font-weight="700">429 / 타임아웃</text>
    <circle cx="980" cy="466" r="12" fill="#c0442e"/><text x="980" y="471" fill="#fff" font-size="14">4</text>
  </g>

  <!-- loop -->
  <rect x="180" y="490" width="900" height="150" rx="6" fill="none" stroke="#e0b96a" stroke-width="1.5"/>
  <path d="M180 490 h90 v22 l-12 12 h-78 z" fill="#f0dcae" stroke="#e0b96a" stroke-width="1.5"/>
  <text x="200" y="513" font-size="16" font-weight="700" fill="#9a7420">loop</text>
  <text x="300" y="513" font-size="15.5" fill="#7a6020">[백오프 재시도 · 최대 3회]</text>
  <g font-size="17" fill="#3a3a3a">
    <path d="M300 545 h60 v25 h-58" fill="none" stroke="#6a6a6a" stroke-width="2" marker-end="url(#ah2)"/>
    <text x="375" y="552">대기 (1·2·4초)</text>
    <circle cx="300" cy="545" r="12" fill="#4a4a44"/><text x="300" y="550" fill="#fff" font-size="14" text-anchor="middle">5</text>
    <line x1="300" y1="600" x2="978" y2="600" stroke="#6a6a6a" stroke-width="2" marker-end="url(#ah2)"/>
    <text x="640" y="592" text-anchor="middle">재호출</text>
    <circle cx="300" cy="600" r="12" fill="#4a4a44"/><text x="300" y="605" fill="#fff" font-size="14" text-anchor="middle">6</text>
  </g>

  <!-- fallback label -->
  <rect x="180" y="665" width="330" height="46" rx="8" fill="#f0dcae" stroke="#e0b96a"/>
  <text x="200" y="694" font-size="18" font-weight="700" fill="#9a7420">재시도 소진 → 타임프레임별 폴백</text>

  <!-- alt box -->
  <rect x="180" y="730" width="900" height="380" rx="6" fill="none" stroke="#e0b96a" stroke-width="1.5"/>
  <path d="M180 730 h90 v22 l-12 12 h-78 z" fill="#f0dcae" stroke="#e0b96a" stroke-width="1.5"/>
  <text x="200" y="753" font-size="16" font-weight="700" fill="#9a7420">alt</text>

  <g font-size="16.5" fill="#3a3a3a">
    <text x="290" y="753" font-size="15.5" fill="#7a6020" font-weight="700">[일봉(D) 실패 + stale daily 있음]</text>
    <path d="M300 778 h60 v25 h-58" fill="none" stroke="#6a6a6a" stroke-width="2" marker-end="url(#ah2)"/>
    <text x="375" y="785">stale daily로 계산 · data_status=stale_cache ("최신 시세 미반영")</text>
    <circle cx="300" cy="778" r="11" fill="#4a4a44"/><text x="300" y="783" fill="#fff" font-size="13" text-anchor="middle">A</text>

    <line x1="180" y1="820" x2="1080" y2="820" stroke="#e0b96a" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="200" y="843" font-size="15.5" fill="#7a6020" font-weight="700">[일봉(D) 실패 + 캐시 없음]</text>
    <path d="M300 868 h60 v25 h-58" fill="none" stroke="#6a6a6a" stroke-width="2" marker-end="url(#ah2)"/>
    <text x="375" y="875">data_limited · 환각으로 안 채움 (안전 착지)</text>
    <circle cx="300" cy="868" r="11" fill="#4a4a44"/><text x="300" y="873" fill="#fff" font-size="13" text-anchor="middle">B</text>
    <rect x="720" y="850" width="200" height="40" rx="8" fill="#f5dad3" stroke="#d9a08e"/>
    <text x="820" y="875" font-size="15" font-weight="700" fill="#c0442e" text-anchor="middle">환각으로 안 채움</text>

    <line x1="180" y1="910" x2="1080" y2="910" stroke="#e0b96a" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="200" y="933" font-size="15.5" fill="#7a6020" font-weight="700">[주봉(W)·월봉(M) 실패 + stale 있음]</text>
    <path d="M300 958 h60 v25 h-58" fill="none" stroke="#6a6a6a" stroke-width="2" marker-end="url(#ah2)"/>
    <text x="375" y="965">stale 상위 타임프레임 사용 · 최신봉 미반영 표시</text>
    <circle cx="300" cy="958" r="11" fill="#4a4a44"/><text x="300" y="963" fill="#fff" font-size="13" text-anchor="middle">C</text>

    <line x1="180" y1="1000" x2="1080" y2="1000" stroke="#e0b96a" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="200" y="1023" font-size="15.5" fill="#7a6020" font-weight="700">[주봉·월봉 실패 + 캐시 없음, D 정상]</text>
    <path d="M300 1048 h60 v25 h-58" fill="none" stroke="#6a6a6a" stroke-width="2" marker-end="url(#ah2)"/>
    <text x="375" y="1055">해당 추세 unavailable · data_limited · 일봉 기준 분석 계속</text>
    <circle cx="300" cy="1048" r="11" fill="#4a4a44"/><text x="300" y="1053" fill="#fff" font-size="13" text-anchor="middle">D</text>
  </g>

  <g font-size="17" fill="#3a3a3a">
    <path d="M300 1140 h60 v25 h-58" fill="none" stroke="#6a6a6a" stroke-width="2" marker-end="url(#ah2)"/>
    <text x="375" y="1147">확보된 범위로 지표·국면 계산</text>
    <circle cx="300" cy="1140" r="12" fill="#4a4a44"/><text x="300" y="1145" fill="#fff" font-size="14" text-anchor="middle">E</text>
  </g>

  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6a6a6a"/></marker>
    <marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#c0442e"/></marker>
  </defs>
</svg>
