[project]
name = "verith-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "redis>=5.0.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "openai>=2,<3",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-neo4j>=0.1",
    "langchain-experimental>=0.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=0.2.0",
    "neo4j>=5",
    "tenacity>=9.1.4",
    "opendartreader>=0.2.3",
    "requests>=2",
    "beautifulsoup4>=4",
    "lxml>=5",
    "json-repair>=0.61.1",
    "sentence-transformers>=5.6.0",
    "rapidfuzz>=3.14.5",
    "transformers>=5.13.0",
    "torch>=2.12.1",
    "apscheduler>=3.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "streamlit>=1.58.0",
]

[tool.pytest.ini_options]
# 테스트에서 `src.agents...` 를 import 할 수 있도록 ai/ 를 sys.path에 추가.
pythonpath = ["."]
testpaths = ["src"]
