[project]
name = "verith-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "openai>=2,<3",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "jinja2>=3.1.6",
    "pykrx>=1.2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "streamlit>=1.58.0",
]

[tool.pytest.ini_options]
# 테스트에서 `src.agents...` 를 import 할 수 있도록 ai/ 를 sys.path에 추가.
pythonpath = ["."]
testpaths = ["src"]
